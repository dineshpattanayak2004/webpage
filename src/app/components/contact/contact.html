<h2>Contact Us</h2>

<label for="name">Name</label>
<br>

<input
  id="name"
  type="text"
  title="Name"
  placeholder="Enter your name"
  [(ngModel)]="name">

<br><br>

<label for="email">Email</label>
<br>

<input
  id="email"
  type="email"
  title="Email"
  placeholder="you@example.com"
  [(ngModel)]="email">

<br><br>

<h3>Live Preview</h3>

<p>Name: {{ name }}</p>
<p>Email: {{ email }}</p>

<button (click)="submitForm()">
  Submit
</button>
